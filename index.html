<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0c1a">
    <title>ACR NEXUS | Loading...</title>
    
    <!-- Open Graph untuk preview share -->
    <meta property="og:title" content="ACR NEXUS | Digital Store">
    <meta property="og:description" content="Gamepass • Cash • Diamond FF & ML • Joki • Logo">
    <meta property="og:image" content="https://files.catbox.moe/91ei5z.jpg">
    <meta property="og:type" content="website">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0c1a;
            color: #edf2ff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            padding: 1rem;
        }
        
        /* ===== BACKGROUND ANIMASI ===== */
        .bg-gradient {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at 50% 40%, #1a0f3d, #0a0c1a 70%);
            z-index: -3;
        }
        
        #dotCanvas {
            position: fixed;
            inset: 0;
            z-index: -2;
            display: block;
        }
        
        .gradient-overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at 50% 40%, rgba(140,80,255,.15), rgba(2,6,23,.8));
            z-index: -1;
            pointer-events: none;
        }
        
        /* ===== PORTAL CONTAINER ===== */
        .portal {
            text-align: center;
            max-width: 500px;
            width: 100%;
            padding: 2.5rem 2rem;
            background: rgba(18, 22, 42, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 2px solid rgba(140, 80, 255, 0.4);
            border-radius: 2rem;
            box-shadow: 
                0 0 60px rgba(180, 80, 255, 0.3),
                0 20px 60px rgba(0, 0, 0, 0.5);
            animation: portalIn 0.8s ease;
            position: relative;
            overflow: hidden;
        }
        
        .portal::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(140,80,255,.1), transparent 60%);
            animation: rotate 20s linear infinite;
            pointer-events: none;
        }
        
        @keyframes portalIn {
            0% { opacity: 0; transform: scale(0.9) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        /* ===== LOGO ===== */
        .logo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #c026d3;
            box-shadow: 
                0 0 30px rgba(200, 80, 255, 0.6),
                0 0 60px rgba(200, 80, 255, 0.3);
            margin-bottom: 1.2rem;
            animation: pulseLogo 2s ease-in-out infinite;
            position: relative;
            z-index: 1;
            background: linear-gradient(135deg, #7c3aed, #c026d3);
        }
        
        @keyframes pulseLogo {
            0%, 100% { 
                transform: scale(1); 
                box-shadow: 0 0 30px rgba(200, 80, 255, 0.6), 0 0 60px rgba(200, 80, 255, 0.3);
            }
            50% { 
                transform: scale(1.05); 
                box-shadow: 0 0 40px rgba(200, 80, 255, 0.9), 0 0 80px rgba(200, 80, 255, 0.5);
            }
        }
        
        /* ===== TITLE ===== */
        .title {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #c48fff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 4px;
            letter-spacing: 1px;
            position: relative;
            z-index: 1;
        }
        
        .subtitle {
            font-size: 0.85rem;
            color: #c4a8ff;
            margin-bottom: 2rem;
            position: relative;
            z-index: 1;
        }
        
        /* ===== LOADING SPINNER ===== */
        .spinner-wrapper {
            position: relative;
            width: 70px;
            height: 70px;
            margin: 0 auto 1.5rem;
            z-index: 1;
        }
        
        .spinner {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 4px solid rgba(140, 80, 255, 0.2);
            border-top-color: #c026d3;
            border-right-color: #7c3aed;
            animation: spin 1s linear infinite;
        }
        
        .spinner-inner {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 3px solid transparent;
            border-bottom-color: #ffe484;
            border-left-color: #c48fff;
            animation: spin 1.5s linear infinite reverse;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* ===== LOADING TEXT ===== */
        .loading-text {
            font-size: 0.95rem;
            color: #e0d0ff;
            font-weight: 600;
            margin-bottom: 1rem;
            position: relative;
            z-index: 1;
        }
        
        .loading-text::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }
        
        @keyframes dots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }
        
        /* ===== PROGRESS BAR ===== */
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 0.8rem;
            position: relative;
            z-index: 1;
            border: 1px solid rgba(140, 80, 255, 0.3);
        }
        
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #7c3aed, #c026d3, #ffe484);
            background-size: 200% 100%;
            border-radius: 20px;
            transition: width 0.3s ease;
            animation: shimmer 2s linear infinite;
            box-shadow: 0 0 15px rgba(200, 80, 255, 0.8);
        }
        
        @keyframes shimmer {
            0% { background-position: 0% 0%; }
            100% { background-position: 200% 0%; }
        }
        
        .progress-percent {
            font-size: 0.75rem;
            color: #ffe484;
            font-weight: 700;
            font-family: monospace;
            letter-spacing: 2px;
            position: relative;
            z-index: 1;
        }
        
        /* ===== INFO ===== */
        .info {
            margin-top: 1.5rem;
            padding-top: 1.2rem;
            border-top: 1px solid rgba(140, 80, 255, 0.2);
            position: relative;
            z-index: 1;
        }
        
        .info p {
            font-size: 0.75rem;
            color: #8b95c9;
            margin-bottom: 0.5rem;
        }
        
        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 0.8rem;
        }
        
        .social-links a {
            color: #c4a8ff;
            font-size: 1.3rem;
            transition: 0.3s;
            text-decoration: none;
        }
        
        .social-links a:hover {
            color: #fff;
            transform: scale(1.2);
            text-shadow: 0 0 20px rgba(200, 80, 255, 0.8);
        }
        
        /* ===== MAINTENANCE MODE ===== */
        .maintenance-box {
            display: none;
        }
        
        .maintenance-box.active {
            display: block;
            position: relative;
            z-index: 1;
        }
        
        .loading-box.hidden {
            display: none;
        }
        
        .maintenance-icon {
            font-size: 5rem;
            color: #fbbf24;
            margin-bottom: 1rem;
            animation: wrench 2s ease-in-out infinite;
            text-shadow: 0 0 30px rgba(251, 191, 36, 0.8);
        }
        
        @keyframes wrench {
            0%, 100% { transform: rotate(-15deg); }
            50% { transform: rotate(15deg); }
        }
        
        .maintenance-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: #fbbf24;
            margin-bottom: 1rem;
            text-shadow: 0 0 20px rgba(251, 191, 36, 0.5);
        }
        
        .maintenance-message {
            font-size: 0.9rem;
            color: #e0d0ff;
            line-height: 1.6;
            margin-bottom: 1rem;
        }
        
        .maintenance-eta {
            display: inline-block;
            padding: 8px 20px;
            background: rgba(251, 191, 36, 0.15);
            border: 1px solid rgba(251, 191, 36, 0.5);
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            color: #fbbf24;
            margin-top: 0.5rem;
        }
        
        /* ===== RESPONSIVE ===== */
        @media (max-width: 500px) {
            .portal { padding: 2rem 1.5rem; }
            .title { font-size: 1.5rem; }
            .logo { width: 80px; height: 80px; }
            .maintenance-icon { font-size: 4rem; }
            .maintenance-title { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <div class="bg-gradient"></div>
    <canvas id="dotCanvas"></canvas>
    <div class="gradient-overlay"></div>

    <div class="portal">
        <!-- ===== LOGO ===== -->
        <img src="https://files.catbox.moe/3janrw.jpg" alt="ACR NEXUS" class="logo" onerror="this.style.display='none'">
        
        <!-- ===== TITLE ===== -->
        <div class="title" id="portalTitle">ACR NEXUS</div>
        <div class="subtitle" id="portalSubtitle">Digital Store • Instant Delivery</div>
        
        <!-- ===== LOADING MODE ===== -->
        <div class="loading-box" id="loadingBox">
            <div class="spinner-wrapper">
                <div class="spinner"></div>
                <div class="spinner-inner"></div>
            </div>
            <div class="loading-text" id="loadingText">Menyiapkan halaman</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-percent" id="progressPercent">0%</div>
        </div>
        
        <!-- ===== MAINTENANCE MODE ===== -->
        <div class="maintenance-box" id="maintenanceBox">
            <div class="maintenance-icon">🔧</div>
            <div class="maintenance-title" id="maintenanceTitle">Sedang Maintenance</div>
            <div class="maintenance-message" id="maintenanceMessage">
                Kami sedang melakukan perbaikan sistem.<br>Silakan kembali lagi nanti ya! 🙏
            </div>
            <div class="maintenance-eta" id="maintenanceEta">Estimasi selesai: 30 menit</div>
        </div>
        
        <!-- ===== INFO / FOOTER ===== -->
        <div class="info">
            <p>© 2025 ACR NEXUS — Premium Digital Store</p>
            <div class="social-links">
                <a href="#" id="linkTiktok" target="_blank" aria-label="TikTok"><i class="fab fa-tiktok"></i></a>
                <a href="#" id="linkInstagram" target="_blank" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
                <a href="#" id="linkWhatsapp" target="_blank" aria-label="WhatsApp"><i class="fab fa-whatsapp"></i></a>
            </div>
        </div>
    </div>

    <!-- ===== CONFIG ===== -->
    <script src="config.js"></script>
    
    <script>
        // ============================================================
        // BACKGROUND ANIMASI DOTS
        // ============================================================
        const canvas = document.getElementById('dotCanvas');
        const ctx = canvas.getContext('2d');
        let dots = [];
        const dotCount = 100;
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        
        class MovingDot {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.radius = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.4;
                this.speedY = (Math.random() - 0.5) * 0.4;
                this.opacity = Math.random() * 0.5 + 0.2;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < -20) this.x = canvas.width + 20;
                if (this.x > canvas.width + 20) this.x = -20;
                if (this.y < -20) this.y = canvas.height + 20;
                if (this.y > canvas.height + 20) this.y = -20;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(170, 200, 255, ${this.opacity})`;
                ctx.shadowBlur = 5;
                ctx.shadowColor = 'rgba(140, 80, 255, 0.5)';
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }
        
        function initDots() {
            dots = [];
            for (let i = 0; i < dotCount; i++) dots.push(new MovingDot());
        }
        
        function animateDots() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            dots.forEach(d => { d.update(); d.draw(); });
            requestAnimationFrame(animateDots);
        }
        
        resizeCanvas();
        initDots();
        animateDots();
        window.addEventListener('resize', () => { resizeCanvas(); initDots(); });
        
        // ============================================================
        // APPLY CONFIG
        // ============================================================
        document.getElementById('portalTitle').textContent = CONFIG.loadingTitle;
        document.getElementById('portalSubtitle').textContent = CONFIG.loadingSubtitle;
        document.getElementById('loadingText').textContent = CONFIG.loadingText;
        document.getElementById('maintenanceTitle').textContent = CONFIG.maintenanceTitle;
        document.getElementById('maintenanceMessage').innerHTML = CONFIG.maintenanceMessage;
        document.getElementById('maintenanceEta').textContent = CONFIG.maintenanceEta;
        
        // Link sosial media
        document.getElementById('linkTiktok').href = CONFIG.tiktok;
        document.getElementById('linkInstagram').href = CONFIG.instagram;
        document.getElementById('linkWhatsapp').href = 'https://wa.me/' + CONFIG.whatsapp;
        
        // ============================================================
        // CEK MAINTENANCE MODE
        // ============================================================
        if (CONFIG.maintenanceMode === true) {
            // Tampilkan mode maintenance
            document.getElementById('loadingBox').classList.add('hidden');
            document.getElementById('maintenanceBox').classList.add('active');
            document.title = '🔧 Maintenance - ACR NEXUS';
        } else {
            // Mulai loading & redirect
            startLoading();
        }
        
        // ============================================================
        // LOADING PROGRESS + AUTO REDIRECT
        // ============================================================
        function startLoading() {
            const duration = CONFIG.loadingDuration;
            const startTime = Date.now();
            const progressFill = document.getElementById('progressFill');
            const progressPercent = document.getElementById('progressPercent');
            
            const interval = setInterval(() => {
                const elapsed = Date.now() - startTime;
                let percent = Math.min(100, (elapsed / duration) * 100);
                
                // Update progress bar
                progressFill.style.width = percent + '%';
                progressPercent.textContent = Math.floor(percent) + '%';
                
                // Update text based on progress
                const loadingText = document.getElementById('loadingText');
                if (percent < 30) {
                    loadingText.textContent = 'Memuat aset';
                } else if (percent < 60) {
                    loadingText.textContent = 'Menyiapkan halaman';
                } else if (percent < 90) {
                    loadingText.textContent = 'Hampir selesai';
                } else {
                    loadingText.textContent = 'Mengalihkan';
                }
                
                // Kalau sudah 100% → redirect
                if (percent >= 100) {
                    clearInterval(interval);
                    progressFill.style.width = '100%';
                    progressPercent.textContent = '100%';
                    
                    // Redirect setelah 500ms biar user lihat 100%
                    setTimeout(() => {
                        window.location.href = CONFIG.redirectUrl;
                    }, 500);
                }
            }, 50);
        }
    </script>
</body>
</html>
